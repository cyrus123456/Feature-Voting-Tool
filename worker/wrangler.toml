name = "feature-voting-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding - ID substituted at deploy time by update-wrangler-config.sh
# from the CF_D1_DATABASE_ID build variable (Cloudflare dashboard → Workers Builds settings)
[[d1_databases]]
binding = "DB"
database_name = "feature-voting-db"
database_id = "${CF_D1_DATABASE_ID}"

# KV namespace for rate limiting - ID substituted from the CF_KV_NAMESPACE_ID build variable
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "${CF_KV_NAMESPACE_ID}"

# Environment variables (non-sensitive)
[vars]
APP_URL = "https://idea.nginxwaf.me"

# Secrets (NEVER commit these - set via wrangler secret put or GitHub Secrets)
# ADMIN_TOKEN - Admin authentication token
# TELEGRAM_BOT_TOKEN - Telegram bot token for notifications
# TELEGRAM_CHAT_ID - Telegram chat ID for notifications
# RESEND_API_KEY - Resend email service API key
# RECAPTCHA_SECRET_KEY - Google reCAPTCHA v3 secret key
# SSO_SECRET - HMAC secret for SSO auto-login links (/auth/sso)

[build]
command = "bash ./update-wrangler-config.sh && npm install && npx tsc"

# Routes - apply to all environments
routes = [
  { pattern = "api.idea.nginxwaf.me/*", zone_name = "idea.nginxwaf.me" }
]

# Production environment
[env.production]
[env.production.vars]
APP_URL = "https://idea.nginxwaf.me"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true